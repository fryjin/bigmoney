name: Big Money CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify, typecheck, test and build
        run: npm run check

      - name: Upload web build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bigmoney-web-dist
          path: apps/web/dist
          if-no-files-found: error
